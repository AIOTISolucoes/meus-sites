<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 236" role="img" aria-label="LS Barbearia">
<title>LS Barbearia</title>
<!-- ============================================================================
     Brasão da LS Barbearia, redesenhado a partir da foto de perfil do
     @lsbarbearia_ (vem em 150×150 e borrada, então é interpretação medida, não
     traço automático). Amarelo #faec41 amostrado no pixel.

     Estrutura, de trás pra frente: escudo → tesoura (argolas + lâminas em X)
     → bigode → faixa com o nome.

     ⚠️ O bigode é PREENCHIDO de propósito. Em contorno ele vira um rabisco que
     ninguém identifica; é a massa cheia que faz o olho ler "bigode". Isso muda
     como a intro anima: os `.tr` se desenham, o bigode entra por escala.

     ⚠️ Abaixo de ~90px este desenho vira borrão. Para a nav existe o monograma
     LS simplificado — não encolher este aqui.
     ========================================================================= -->
<g fill="none" stroke="#faec41" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
  <path class="tr" d="M32 86 L32 148 C32 180 60 202 100 216 C140 202 168 180 168 148 L168 86 Z"/>
  <path d="M43 96 L43 146 C43 172 65 190 100 201 C135 190 157 172 157 146 L157 96 Z"
        stroke-width="1.3" opacity=".5"/>

  <ellipse class="tr" cx="46" cy="64" rx="12" ry="16" transform="rotate(-20 46 64)"/>
  <ellipse class="tr" cx="154" cy="62" rx="12" ry="16" transform="rotate(20 154 62)"/>
  <path class="tr" d="M53 79 L147 197"/>
  <path class="tr" d="M147 77 L55 200"/>

  <path class="tr" d="M22 126 Q100 115 178 126 L178 152 Q100 141 22 152 Z" stroke-width="2.2"/>
  <path class="tr" d="M22 126 L8 138 L22 152"/>
  <path class="tr" d="M178 126 L192 138 L178 152"/>
</g>

<path class="bigode" fill="#faec41"
      d="M100 80 C107 85 116 88 125 87 C136 86 142 91 139 97
         C135 105 123 111 114 108 C107 106 102 101 100 95
         C98 101 93 106 86 108 C77 111 65 105 61 97
         C58 91 64 86 75 87 C84 88 93 85 100 80 Z"/>

<text x="100" y="144" text-anchor="middle" fill="#faec41"
      style="font:700 16px Oswald,Impact,sans-serif;letter-spacing:.05em">LS BARBEARIA</text>
</svg>
